<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Photos by Gab">
<link rel="icon" href="logo.jpeg">
<title>My Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f7f7f5; --ink:#161615; --mute:#8e8d88; --line:#dcdbd6; --accent:#800000;
  --scope:#e8e7e3; --grat:#d2d0ca; --grat-ink:#aeaba4; --skin:#cbb8a6; --puck:#1a1a19;
  --mat:#cccccc; /* border colour around each photo */
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e0e0d;--ink:#ebeae5;--mute:#7c7b76;--line:#2a2a27;--accent:#c4524f;--scope:#262624;--grat:#3a3936;--grat-ink:#6a6862;--skin:#6b5d50;--puck:#f2f1ec;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e0e0d;--ink:#ebeae5;--mute:#7c7b76;--line:#2a2a27;--accent:#c4524f;--scope:#262624;--grat:#3a3936;--grat-ink:#6a6862;--skin:#6b5d50;--puck:#f2f1ec;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.page{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;padding-block:16px;padding-inline:20px}
header{display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{display:block;width:28px;height:28px}.logo img{display:block;width:100%;height:100%}
.infobtn{color:var(--mute)}
.infobtn:hover,.infobtn[aria-expanded="true"]{color:var(--ink)}
.info{position:absolute;right:0;top:calc(100% + 10px);z-index:5;width:min(280px,calc(100vw - 40px));background:var(--bg);border:1px solid var(--line);padding:14px 16px;display:grid;gap:8px}
.info p{margin:0}
.info .m{color:var(--mute)}
.info a{text-decoration:none;border-bottom:1px solid var(--line)}
.info a:hover{border-color:currentColor}
.mail{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mail a{user-select:all}
#copymail{color:var(--mute);font-size:12px}
#copymail:hover{color:var(--ink)}

main{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.6fr);gap:clamp(24px,5vw,80px);align-items:center;min-height:0}
.left{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:0}
.scope{position:relative;width:min(100%,52vh,440px);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--scope);touch-action:none;cursor:crosshair;user-select:none}
.scope canvas{image-rendering:auto}
.scope canvas,.scope svg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}
.scope.sq,.scope.sq canvas,.scope.sq svg{border-radius:0}
.g{fill:none;stroke:var(--grat);stroke-width:.004}
.g-skin{stroke:var(--skin);stroke-width:.004;stroke-dasharray:.02 .015}
.g-t{fill:var(--grat-ink);font:400 .042px var(--mono);text-anchor:middle;dominant-baseline:central;letter-spacing:.004px}
.puck{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid var(--puck);box-shadow:0 0 0 1px var(--scope),inset 0 0 0 1px var(--scope);cursor:grab;touch-action:none}
.puck::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--puck)}
.note{margin:0;color:var(--mute);font-size:12px;text-align:center;max-width:44ch;min-height:2.8em;text-wrap:balance}
.puck:active{cursor:grabbing}
.puck.hint::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--accent);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.cue{display:none;margin:0;font-size:12px;line-height:1.35;color:var(--ink)}
.cue b{font-weight:500;color:var(--accent)}
.modes{display:flex;gap:16px;font:400 12px/1 var(--mono)}
.modes button{color:var(--mute);padding:3px 0;border-bottom:1px solid transparent}
.modes button:hover{color:var(--ink)}
.modes button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.modes button:disabled{opacity:.4;cursor:default}
.readout em{font-style:normal}
.readout{display:flex;gap:18px;font:400 12px/1 var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.readout b{font-weight:400;color:var(--ink)}
.match{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:4px 2px}
.match:focus-within{border-color:var(--ink)}
.match label{color:var(--mute);font-size:12px;white-space:nowrap}
.match .chip{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.match input{font:400 13px/1 var(--mono);color:var(--ink);background:none;border:0;outline:0;width:8ch;padding:4px 0;text-transform:lowercase}
.match input::placeholder{color:var(--mute)}
.match button{color:var(--mute);font-size:12px}
.match button:hover{color:var(--ink)}
.match[data-bad] input{color:var(--accent)}
.brand{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;box-shadow:0 0 0 1.5px var(--scope),0 0 0 2.5px var(--ink);pointer-events:none}
.pal{position:absolute;left:0;right:0;bottom:0;display:flex;opacity:0;transition:opacity .15s;z-index:2}
.tile:hover .pal,.tile:focus-within .pal{opacity:1}
.pal button{flex:1;height:30px;display:flex;align-items:flex-end;padding:0 0 5px 6px;font:400 10px/1 var(--mono);letter-spacing:.02em}
.pal button span{opacity:0;transition:opacity .15s}
.pal button:hover span,.pal button:focus-visible span{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:7px 12px;font:400 12px/1 var(--mono);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* touch screens: palette is always visible, as a strip BELOW the grey mat (not over it) */
@media (hover:none){.pal{position:static;opacity:1}.pal button{height:10px;padding:0}.pal button span{display:none}}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:center;width:100%;max-width:calc((100vh - 140px) * 1.5)}
.tile{position:relative;overflow:hidden;margin:0;cursor:pointer}
.mat{position:relative;aspect-ratio:1;background:var(--mat)}
.mat img{position:absolute;inset:5%;width:90%;height:90%;object-fit:contain;display:block}
.tile.in img{animation:in .45s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}

/* grid view: every photo, page scrolls */
html.wall,html.wall body{height:auto}
html.wall .page{height:auto;min-height:100%;display:block}
html.wall main{display:block}
html.wall .left{display:none}
html.wall header{position:sticky;top:0;z-index:6;background:var(--bg);padding-block:8px;margin-bottom:8px}
html.wall .grid{grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:6px;max-width:none;align-content:start}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;padding:12px 16px;color:var(--mute);display:none;z-index:2}
.lb-nav:hover{color:var(--ink)}.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lightbox.nav .lb-nav{display:block}
/* click-to-zoom overlay */
.lightbox{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.lightbox.active{opacity:1;pointer-events:auto}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;display:block;box-shadow:0 20px 40px rgba(0,0,0,.15)}
.lightbox .lb-pal{display:flex;gap:4px;margin-top:16px}
.lightbox .lb-pal button{height:24px;padding:0 8px;font:400 11px/1 var(--mono);border:1px solid var(--line)}

@media (max-width:760px){
  main{display:block}
  .left{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 16px;padding-block:8px 12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .left .scope{grid-row:1 / span 3;width:min(40vw,168px)}
  .left .readout{gap:12px;font-size:11px}
  .left .match{padding:2px 0;gap:8px}
  .left .match label{display:none}
  .left .match input{width:7.5ch}
  .note{display:none}
  .cue{display:block}
  .puck{width:22px;height:22px;margin:-11px 0 0 -11px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  html,body{height:auto}
  .page{height:auto;min-height:100%}
  main{grid-template-columns:1fr;gap:24px}
  .grid{max-width:none;gap:6px}
}
@media (prefers-reduced-motion:reduce){.puck.hint::before{animation:none;transform:scale(1.4);opacity:.6}.tile.in img{animation:none}}
</style>
</head>
<body>
<div class="page">
  <header>
    <a class="logo" href="#" aria-label="Gab"><img src="logo.jpeg" alt="Gab" width="28" height="28"></a>
    <div class="modes" id="modes" role="group" aria-label="View"><button type="button" data-mode="color" aria-pressed="true">Colour</button><button type="button" data-mode="tone" aria-pressed="false">Tone</button><button type="button" data-mode="grid" aria-pressed="false">Grid</button></div>
    <button class="infobtn" id="infobtn" type="button" aria-expanded="false" aria-controls="info">Info</button>
    <div class="info" id="info" hidden>
      <p>Gab — Photos I Like</p>
      <p class="m">Drag through the scope to find frames by colour.</p>
      <p class="mail"><a href="mailto:gabrielvilnar@gmail.com" id="mail">gabrielvilnar@gmail.com</a><button type="button" id="copymail">Copy</button></p>
      <p><a href="https://www.instagram.com/gabrielvilnar/" target="_blank" rel="noopener">Instagram @gabrielvilnar</a></p>
    </div>
  </header>
  <main>
    <div class="left">
      <div class="scope" id="scope" aria-label="Vectorscope. Drag the point to pick a colour.">
        <canvas id="trace"></canvas>
        <svg id="grat" viewBox="-1.05 -1.05 2.1 2.1" aria-hidden="true"></svg>
        <div class="brand" id="brand" hidden></div>
        <div class="puck hint" id="puck" tabindex="0" role="slider" aria-label="Colour picker. Arrow keys move, Enter resets."></div>
      </div>
      <p class="cue" id="cue"><b>Drag the dot</b> to change the photos by colour.</p>
      <div class="readout"><span><em id="l1">HUE</em> <b id="rh">000°</b></span><span><em id="l2">SAT</em> <b id="rs">00%</b></span></div>
      <form class="match" id="match" autocomplete="off">
        <label for="hex">Brand colour</label><span class="chip" id="chip"></span>
        <input id="hex" name="hex" placeholder="#800000" maxlength="7" spellcheck="false" aria-describedby="note">
        <button type="submit">Match</button>
      </form>
      <p class="note" id="note">Drag the point, or paste a brand colour to see frames that sit in it. Hover a frame for its palette.</p>
    </div>
    <section class="grid" id="grid" aria-live="polite" aria-label="Frames nearest the chosen colour"></section>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="lightbox" id="lightbox" aria-hidden="true">
  <img id="lb-img" alt="Enlarged photograph">
  <div class="lb-pal" id="lb-pal"></div>
  <button class="lb-nav prev" type="button" aria-label="Previous photo">‹</button><button class="lb-nav next" type="button" aria-label="Next photo">›</button>
</div>

<script>
(() => {
const SHOW = 6;

const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const clamp=v=>Math.max(0,Math.min(255,v));
const ycc=([r,g,b])=>{r/=255;g/=255;b/=255;return[.299*r+.587*g+.114*b,-.168736*r-.331264*g+.5*b,.5*r-.418688*g-.081312*b]};
const fromYcc=(Y,Cb,Cr)=>[Y+1.402*Cr,Y-.344136*Cb-.714136*Cr,Y+1.772*Cb].map(v=>clamp(v*255));
const D2R=Math.PI/180;
const K=3.4;
const uv=(Cb,Cr)=>[Cb*K,-Cr*K];
const hexOf=c=>'#'+c.map(v=>Math.round(clamp(v)).toString(16).padStart(2,'0')).join('');

const FRAMES=[];
const $=id=>document.getElementById(id);
const scope=$('scope'),puck=$('puck'),trace=$('trace'),grid=$('grid'),lightbox=$('lightbox'),lbImg=$('lb-img'),lbPal=$('lb-pal');
const HOME=[Math.cos(123*D2R)*.22,-Math.sin(123*D2R)*.22];
let P=[...HOME],shown=[],hero=true;
/* mapping modes: 'color' (hue/saturation, circular scope), 'tone' (brightness/contrast, square scope) and 'grid' (every photo, arranged by similarity) */
let mode='color';const A=.78;
let TONE={k0:0,k1:1,c0:0,c1:1};
const nz=(v,a,b)=>((v-a)/(b-a)*2-1)*A,dz=(w,a,b)=>a+((w/A+1)/2)*(b-a);
const toneUV=(k,c)=>[nz(k,TONE.k0,TONE.k1),-nz(c,TONE.c0,TONE.c1)];
const toneAt=([u,v])=>[dz(u,TONE.k0,TONE.k1),dz(-v,TONE.c0,TONE.c1)];
const home=()=>mode==='tone'?[0,0]:[...HOME];
const pos=f=>mode==='tone'?f.t.q:f.t.p;
const clampP=(u,v)=>{if(mode==='tone')return[Math.max(-1,Math.min(1,u)),Math.max(-1,Math.min(1,v))];const m=Math.hypot(u,v);return m>1?[u/m,v/m]:[u,v]};

function graticule(){
  let s='';
  if(mode==='tone'){
    s+=`<rect class="g" x="-1" y="-1" width="2" height="2"/>`;
    [-.5,.5].forEach(t=>s+=`<line class="g" x1="${t}" x2="${t}" y1="-1" y2="1"/><line class="g" y1="${t}" y2="${t}" x1="-1" x2="1"/>`);
    s+=`<line class="g" x1="-1" x2="1" y1="0" y2="0"/><line class="g" y1="-1" y2="1" x1="0" x2="0"/>`;
    [['DARK',-.87,-.06],['LIGHT',.87,-.06],['PUNCHY',0,-.95],['FLAT',0,.95]].forEach(([l,x,y])=>s+=`<text class="g-t" x="${x}" y="${y}">${l}</text>`);
    $('grat').innerHTML=s;return;
  }
  [.25,.5,.75,1].forEach(r=>s+=`<circle class="g" r="${r}"/>`);
  s+=`<line class="g" x1="-1" x2="1" y1="0" y2="0"/><line class="g" y1="-1" y2="1" x1="0" x2="0"/>`;
  for(let a=0;a<360;a+=10){const r1=a%30?.97:.94,c=Math.cos(a*D2R),n=-Math.sin(a*D2R);s+=`<line class="g" x1="${(c*r1).toFixed(3)}" y1="${(n*r1).toFixed(3)}" x2="${c.toFixed(3)}" y2="${n.toFixed(3)}"/>`}
  const sk=[Math.cos(123*D2R),-Math.sin(123*D2R)];s+=`<line class="g-skin" x1="0" y1="0" x2="${sk[0].toFixed(3)}" y2="${sk[1].toFixed(3)}"/>`;
  [['R',[191,0,0]],['YL',[191,191,0]],['G',[0,191,0]],['CY',[0,191,191]],['B',[0,0,191]],['MG',[191,0,191]]].forEach(([l,rgb])=>{
    const[,Cb,Cr]=ycc(rgb),[u0,v0]=uv(Cb,Cr),m=Math.hypot(u0,v0),lx=u0/m*.88,ly=v0/m*.88;
    s+=`<text class="g-t" x="${lx.toFixed(3)}" y="${ly.toFixed(3)}">${l}</text>`});
  $('grat').innerHTML=s;
}

let TB=0,base=null,baseDone=new Set(),tctx=null,timg=null,acc=null;
function traceIdx(f){if(f.t.idxB===TB)return f.t.idx;const n=f.t.pts.length/2,idx=new Int32Array(n),R=TB/2;
  for(let j=0;j<n;j++){const x=Math.round(R+f.t.pts[j*2]*R),y=Math.round(R+f.t.pts[j*2+1]*R);idx[j]=(x<0||y<0||x>=TB-1||y>=TB-1)?-1:y*TB+x}
  f.t.idx=idx;f.t.idxB=TB;return idx}
function blend(buf,f,a){const idx=traceIdx(f),c=f.t.rgb;
  for(let j=0;j<idx.length;j++){const i0=idx[j];if(i0<0)continue;const r=c[j*3]*a,g=c[j*3+1]*a,b=c[j*3+2]*a;
    for(const i of [i0,i0+1,i0+TB,i0+TB+1]){const q=i*4,k=1-a;buf[q]=r+buf[q]*k;buf[q+1]=g+buf[q+1]*k;buf[q+2]=b+buf[q+2]*k;buf[q+3]=a+buf[q+3]*k}}}
function drawTone(dpr){
  const R=TB/2,ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#888';
  tctx.clearRect(0,0,TB,TB);tctx.strokeStyle=ink;tctx.lineWidth=dpr;
  const dot=(f,r,a)=>{const q=pos(f);if(!q)return;const g=Math.round(f.t.k*255);
    tctx.globalAlpha=a;tctx.fillStyle=`rgb(${g},${g},${g})`;tctx.beginPath();tctx.arc(R+q[0]*R,R+q[1]*R,r,0,6.2832);tctx.fill();
    tctx.globalAlpha=a*.4;tctx.stroke()};
  for(const f of FRAMES)dot(f,2.6*dpr,.55);
  for(const id of shown)dot(FRAMES[id],5*dpr,1);
  tctx.globalAlpha=1;
}
function drawTrace(){
  const dpr=Math.min(2,devicePixelRatio||1),S=Math.min(560,Math.round(scope.clientWidth*dpr));if(!S)return;
  if(S!==TB){TB=S;trace.width=trace.height=S;tctx=trace.getContext('2d');timg=tctx.createImageData(S,S);base=new Float32Array(S*S*4);acc=new Float32Array(S*S*4);baseDone=new Set()}
  if(mode==='tone'){drawTone(S/scope.clientWidth);return}
  for(const f of FRAMES)if(f.t.rgb&&!baseDone.has(f.id)){blend(base,f,.09);baseDone.add(f.id)}
  acc.set(base);for(const id of shown){const f=FRAMES[id];if(f.t.rgb)blend(acc,f,.7)}
  const d=timg.data;for(let q=0;q<acc.length;q+=4){const a=acc[q+3];if(a<=0){d[q+3]=0;continue}d[q]=acc[q]/a;d[q+1]=acc[q+1]/a;d[q+2]=acc[q+2]/a;d[q+3]=a*255}
  tctx.putImageData(timg,0,0);
}

function nearest(){return FRAMES.filter(f=>pos(f)).map(f=>({f,d:Math.hypot(pos(f)[0]-P[0],pos(f)[1]-P[1])})).sort((a,b)=>a.d-b.d).slice(0,SHOW).map(o=>o.f.id)}
function render(){
  if(mode==='grid')return;
  puck.style.left=`${50+P[0]*50}%`;puck.style.top=`${50+P[1]*50}%`;
  if(mode==='tone'){
    const[a,b]=toneAt(P),pc=v=>String(Math.round(Math.max(0,Math.min(1,v))*100)).padStart(2,'0')+'%';
    $('rh').textContent=pc(a);$('rs').textContent=pc(b);
    puck.setAttribute('aria-valuetext',`Brightness ${pc(a)}, contrast ${pc(b)}`);
  }else{
    const hue=Math.round(((Math.atan2(-P[1],P[0])/D2R)+360)%360),sat=Math.round(Math.hypot(P[0],P[1])*100);
    $('rh').textContent=String(hue).padStart(3,'0')+'°';$('rs').textContent=String(sat).padStart(2,'0')+'%';
    const ph=hexOf(fromYcc(.55,P[0]/K,-P[1]/K));$('chip').style.background=brand?brand.hex:ph;if(document.activeElement!==$('hex')&&!brand)$('hex').placeholder=ph;
    puck.setAttribute('aria-valuetext',`Hue ${hue} degrees, saturation ${sat} percent`);
  }
  const next=nearest();if(next.join()===shown.join())return;
  const prev=new Set(shown);shown=next;
  grid.innerHTML=shown.map(id=>{const f=FRAMES[id];return `<figure class="tile${prev.has(id)?'':' in'}" data-id="${id}"><div class="mat"><img src="${f.url}" loading="lazy" decoding="async" width="520" height="520" alt="Photograph" onerror="console.warn('Missing image:',this.src)"></div><div class="pal">${f.t.pal.map(c=>{const h=hexOf(c),lt=ycc(c)[0]>.6;return `<button type="button" data-hex="${h}" style="background:${h};color:${lt?'#1a1a19':'#f4f3ef'}" aria-label="Copy ${h}"><span>${h}</span></button>`}).join('')}</div></figure>`}).join('');
  drawTrace();
}
function setFromEvent(e){
  const b=scope.getBoundingClientRect();let u=(e.clientX-b.left)/b.width*2-1,v=(e.clientY-b.top)/b.height*2-1;
  P=clampP(u,v);hero=false;clearBrand();render();
}
let drag=false;
function explored(){puck.classList.remove('hint');$('cue').hidden=true}
scope.addEventListener('pointerdown',e=>{drag=true;explored();scope.setPointerCapture(e.pointerId);setFromEvent(e);puck.focus({preventScroll:true})});
let pend=null;scope.addEventListener('pointermove',e=>{if(!drag)return;const first=!pend;pend=e;if(first)requestAnimationFrame(()=>{const ev=pend;pend=null;setFromEvent(ev)})});
scope.addEventListener('pointerup',()=>drag=false);
scope.addEventListener('pointercancel',()=>drag=false);
scope.addEventListener('dblclick',()=>{P=home();hero=true;clearBrand();render()});
puck.addEventListener('keydown',e=>{const st=e.shiftKey?.08:.02,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(e.key==='Enter'){P=home();hero=true;render();return}if(!m)return;e.preventDefault();hero=false;explored();P=clampP(P[0]+m[0],P[1]+m[1]);render()});
new ResizeObserver(drawTrace).observe(scope);

/* ---- click-to-zoom: shows the gallery image at once, swaps in the full-size one when it has loaded ---- */
let lbCur=null;
function openLightbox(f){
  lbCur=f;lbImg.src=f.url;lightbox.classList.toggle('nav',mode==='grid');
  lbPal.innerHTML=f.t.pal.map(c=>{const h=hexOf(c),lt=ycc(c)[0]>.6;return `<button type="button" data-hex="${h}" style="background:${h};color:${lt?'#1a1a19':'#f4f3ef'}">${h}</button>`}).join('');
  lightbox.classList.add('active');lightbox.setAttribute('aria-hidden','false');
  if(f.fullUrl!==f.url){const im=new Image();
    im.onload=()=>{if(lbCur===f)lbImg.src=f.fullUrl};
    im.onerror=()=>console.warn('Full-size image not found, keeping gallery version:',f.fullUrl);
    im.src=f.fullUrl}
}
function step(d){const i=WALL.indexOf(lbCur.id)+d;if(i>=0&&i<WALL.length)openLightbox(FRAMES[WALL[i]])}
function closeLightbox(){lbCur=null;lightbox.classList.remove('active');lightbox.setAttribute('aria-hidden','true')}
grid.addEventListener('click',e=>{
  if(e.target.closest('.pal button'))return;
  const tile=e.target.closest('.tile');if(!tile)return;
  const f=FRAMES[Number(tile.dataset.id)];if(f)openLightbox(f);
});
lightbox.addEventListener('click',e=>{
  const n=e.target.closest('.lb-nav');if(n){step(n.classList.contains('next')?1:-1);return}
  const b=e.target.closest('.lb-pal button');
  if(b){const h=b.dataset.hex;try{navigator.clipboard.writeText(h).then(()=>toast('Copied '+h),()=>toast(h))}catch(_){toast(h)}return}
  if(e.target===lightbox)closeLightbox();   // background only: clicking the photo itself keeps it open
});

/* ---- mapping mode ---- */
const NOTES={color:'Drag the point, or paste a brand colour to see frames that sit in it. Hover a frame for its palette.',
  tone:'Drag the point: dark to light across, flat to punchy up and down. Hover a frame for its palette.'};
const WORDS={color:['HUE','SAT','colour'],tone:['KEY','CONTRAST','tone']};
function setMode(m){
  if(m===mode)return;const was=mode;mode=m;clearBrand();
  document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  document.documentElement.classList.toggle('wall',m==='grid');
  grid.setAttribute('aria-live',m==='grid'?'off':'polite');
  if(m==='grid'||was==='grid')shown=[];
  if(m==='grid'){renderWall();scrollTo(0,0);return}
  scope.classList.toggle('sq',m==='tone');$('match').hidden=m!=='color';$('note').textContent=NOTES[m];
  $('cue').innerHTML=`<b>Drag the dot</b> to change the photos by ${WORDS[m][2]}.`;
  $('l1').textContent=WORDS[m][0];$('l2').textContent=WORDS[m][1];
  P=home();hero=true;graticule();render();drawTrace();
}

/* ---- grid view: every photo, arranged so neighbours in all directions look alike ----
   features per photo: colour position (p) + brightness (k) + contrast (c), standardised.
   start: PCA sort into rows; then seeded simulated-annealing swaps to minimise neighbour distance */
let WALL=[],WALLC=0;const wallCache={};
function wallLayout(C){
  if(wallCache[C])return wallCache[C];
  const N=FRAMES.length,D=4,Fv=new Float32Array(N*D);
  const raw=FRAMES.map(f=>[f.t.p[0],f.t.p[1],f.t.k??f.t.y,f.t.c??0]);
  for(let k=0;k<D;k++){const m=raw.reduce((s,r)=>s+r[k],0)/N,sd=Math.max(.02,Math.sqrt(raw.reduce((s,r)=>s+(r[k]-m)**2,0)/N));raw.forEach((r,i)=>Fv[i*D+k]=(r[k]-m)/sd)}
  const cov=Array.from({length:D},()=>new Float64Array(D));
  for(let i=0;i<N;i++)for(let a=0;a<D;a++)for(let b=0;b<D;b++)cov[a][b]+=Fv[i*D+a]*Fv[i*D+b]/N;
  const eig=M=>{let v=[1,.7,.4,.2];for(let t=0;t<60;t++){const w=M.map(r=>r.reduce((s,x,j)=>s+x*v[j],0)),n=Math.hypot(...w)||1;v=w.map(x=>x/n)}
    const l=M.map(r=>r.reduce((s,x,j)=>s+x*v[j],0)).reduce((s,x,j)=>s+x*v[j],0);return[v,l]};
  const[v1,l1]=eig(cov),[v2]=eig(cov.map((r,a)=>Float64Array.from(r,(x,b)=>x-l1*v1[a]*v1[b])));
  const pr=(i,v)=>{let s=0;for(let k=0;k<D;k++)s+=Fv[i*D+k]*v[k];return s};
  const ord=[...Array(N).keys()].map(i=>({i,x:pr(i,v1),y:pr(i,v2)})).sort((a,b)=>a.y-b.y),G=new Int32Array(N),R=Math.ceil(N/C);
  for(let r=0;r<R;r++)ord.slice(r*C,Math.min(N,(r+1)*C)).sort((a,b)=>a.x-b.x).forEach((o,c)=>G[r*C+c]=o.i);
  const NB=Array.from({length:N},(_,p)=>{const a=[],c=p%C;if(c>0)a.push(p-1);if(c<C-1&&p+1<N)a.push(p+1);if(p>=C)a.push(p-C);if(p+C<N)a.push(p+C);return a});
  const d2=(x,y)=>{let s=0;for(let k=0;k<D;k++){const t=Fv[x*D+k]-Fv[y*D+k];s+=t*t}return s};
  const loc=(a,b)=>{let s=0;for(const q of NB[a])s+=d2(G[a],G[q]);for(const q of NB[b])s+=d2(G[b],G[q]);if(NB[a].includes(b))s-=d2(G[a],G[b]);return s};
  let e=0,cnt=0;for(let p=0;p<N;p++)for(const q of NB[p])if(q>p){e+=d2(G[p],G[q]);cnt++}
  const T0=e/Math.max(1,cnt)*.25,IT=Math.min(N*400,400000);let sd=12345;
  const rnd=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let it=0;it<IT;it++){const a=(rnd()*N)|0,b=(rnd()*N)|0;if(a===b)continue;const T=T0*(1-it/IT),bf=loc(a,b);
    [G[a],G[b]]=[G[b],G[a]];const af=loc(a,b);if(af>bf&&(T<=0||rnd()>=Math.exp((bf-af)/T)))[G[a],G[b]]=[G[b],G[a]]}
  return wallCache[C]=Array.from(G);
}
const wallCols=()=>Math.max(3,Math.floor((grid.clientWidth||innerWidth-40)/(innerWidth<760?100:130)));
function renderWall(){
  if(!FRAMES.length)return;
  const C=wallCols();WALLC=C;WALL=wallLayout(C);grid.style.setProperty('--cols',C);
  grid.innerHTML=WALL.map(id=>`<figure class="tile" data-id="${id}"><div class="mat"><img src="${FRAMES[id].th}" loading="lazy" decoding="async" width="360" height="360" alt="Photograph" onerror="console.warn('Missing image:',this.src)"></div></figure>`).join('');
}
let rsT=0;addEventListener('resize',()=>{if(mode!=='grid')return;clearTimeout(rsT);rsT=setTimeout(()=>{if(wallCols()!==WALLC)renderWall()},150)});
$('modes').addEventListener('click',e=>{const b=e.target.closest('button[data-mode]');if(b&&!b.disabled)setMode(b.dataset.mode)});

/* ---- brand colour match ---- */
let brand=null;
function clearBrand(){if(!brand)return;brand=null;$('brand').hidden=true;$('hex').value=''}
function parseHex(v){v=v.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(v))v=v.split('').map(c=>c+c).join('');return /^[0-9a-f]{6}$/i.test(v)?'#'+v.toLowerCase():null}
$('match').addEventListener('submit',e=>{
  e.preventDefault();const h=parseHex($('hex').value);
  if(!h){$('match').dataset.bad='';$('note').textContent='Use a hex code like #800000.';return}
  delete $('match').dataset.bad;
  const[,Cb,Cr]=ycc(hex2rgb(h));let[u,v]=uv(Cb,Cr);const m=Math.hypot(u,v);if(m>1){u/=m;v/=m}
  brand={hex:h};hero=false;explored();P=[u,v];$('hex').value=h;
  const b=$('brand');b.hidden=false;b.style.background=h;b.style.left=`${50+u*50}%`;b.style.top=`${50+v*50}%`;
  $('note').textContent=m<.06?`${h} is close to neutral, so this leans on black & white and muted frames.`:`Frames closest to ${h}. Drag to explore around it.`;
  render();
});
$('hex').addEventListener('input',()=>{delete $('match').dataset.bad;const h=parseHex($('hex').value);if(h)$('chip').style.background=h});
$('hex').addEventListener('paste',()=>setTimeout(()=>{if(parseHex($('hex').value))$('match').requestSubmit()},0));

/* ---- copy a palette colour ---- */
let tt;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}
grid.addEventListener('click',e=>{const b=e.target.closest('.pal button');if(!b)return;const h=b.dataset.hex;
  try{navigator.clipboard.writeText(h).then(()=>toast('Copied '+h),()=>toast(h))}catch(_){toast(h)}});

$('copymail').addEventListener('click',()=>{
  const t='gabrielvilnar@gmail.com';
  const sel=()=>{const r=document.createRange();r.selectNodeContents($('mail'));const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Selected — press Ctrl/Cmd+C')};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copied '+t),sel)}catch(_){sel()}
});

const ib=$('infobtn'),info=$('info');
ib.onclick=()=>{info.hidden=!info.hidden;ib.setAttribute('aria-expanded',!info.hidden)};
document.addEventListener('keydown',e=>{
  if(lightbox.classList.contains('active')&&mode==='grid'){const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-WALLC,ArrowDown:WALLC}[e.key];if(d){e.preventDefault();step(d);return}}
  if(e.key!=='Escape')return;
  if(lightbox.classList.contains('active'))closeLightbox();
  else if(!info.hidden){info.hidden=true;ib.setAttribute('aria-expanded','false');ib.focus()}
});
document.addEventListener('click',e=>{if(!info.hidden&&!info.contains(e.target)&&e.target!==ib){info.hidden=true;ib.setAttribute('aria-expanded','false')}});

(async()=>{
  graticule();render();
  let list;
  try{list=await (await fetch('photos.json',{cache:'no-cache'})).json()}
  catch(_){$('note').textContent='Could not load photos.json.';return}
  if(!list.length){$('note').textContent='No photos yet.';return}
  list.forEach((o,id)=>{
    const bin=atob(o.tr),n=bin.length/3,rgb=new Uint8Array(bin.length),pts=new Float32Array(n*2);
    for(let j=0;j<bin.length;j++)rgb[j]=bin.charCodeAt(j);
    for(let j=0;j<n;j++){const[,Cb,Cr]=ycc([rgb[j*3],rgb[j*3+1],rgb[j*3+2]]),[u,v]=uv(Cb,Cr);pts[j*2]=u;pts[j*2+1]=v}
    /* gallery uses thumb (or src); zoom uses full (or falls back to the same low-res file) */
    const url=encodeURI(o.thumb||o.src);
    FRAMES.push({id,url,th:encodeURI(o.th||o.thumb||o.src),fullUrl:encodeURI(o.full||o.thumb||o.src),t:{pts,rgb,p:o.p,y:o.y,pal:o.pal,k:o.k,c:o.c,}});
  });
  /* tone and light modes: fit the axes to this collection so photos spread across the scope */
  const rng=vals=>{let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<.05){const m=(lo+hi)/2;lo=m-.025;hi=m+.025}return[lo,hi]};
  const off=m=>{const b=document.querySelector(`#modes [data-mode="${m}"]`);b.disabled=true;b.title='Re-run make_manifest.py to enable'};
  const T=FRAMES.filter(f=>f.t.k!=null);
  if(T.length){const[k0,k1]=rng(T.map(f=>f.t.k)),[c0,c1]=rng(T.map(f=>f.t.c));TONE={k0,k1,c0,c1};T.forEach(f=>f.t.q=toneUV(f.t.k,f.t.c))}else off('tone');
  render();drawTrace();
})();
})();
</script>
